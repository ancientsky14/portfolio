# Security (R23): weekly dependency updates for the site, both Workers and
# the workflow's SHA-pinned actions. Minor and patch bumps arrive as one PR
# per directory; majors stay separate, since those are the ones that break.

version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /workers/contact
      - /workers/visits
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # @types/node follows the Node version the site runs on (22, in
    # deploy.yml), not the newest Node. Bump its major by hand together with
    # `node-version` (R28).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
