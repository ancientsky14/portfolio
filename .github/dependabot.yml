# Security (R23): weekly dependency updates for the site, both Workers and
# the workflow's SHA-pinned actions. Minor and patch bumps arrive as one PR
# per directory; majors stay separate, since those are the ones that break.

version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /workers/contact
      - /workers/visits
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
