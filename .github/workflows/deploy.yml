# Builds the static export and publishes it to Cloudflare. GitHub Pages now
# serves only a redirect to it.
#
# Cloudflare (R27): https://portfolio.ancientsky14.workers.dev, an assets-only
# Worker (wrangler.jsonc at the repo root) that serves real security headers
# from out/_headers. Built with no base path. Needs the `cloudflare`
# environment (Settings → Environments, branch `portfolio` only) holding
# CLOUDFLARE_API_TOKEN — a token with Account → Workers Scripts: Edit and
# nothing else.
#
# GitHub Pages: https://ancientsky14.github.io/portfolio/ serves redirect/
# (index.html, copied to 404.html), which sends every old link to the same
# path on workers.dev (R27). The path follows the repo name, case and all.

name: Deploy

on:
  push:
    branches: [portfolio]
  workflow_dispatch:

# Security (R24): no permissions by default; each job asks for its own. The
# build job runs `npm ci` — every dependency's install scripts — so it gets
# read access only and never sees a deploy credential. Deploy rights live in
# the deploy jobs, which install nothing from the site's package.json.
#
# Actions are pinned to full commit SHAs, not tags: a tag can be moved to
# different code, a SHA cannot. Dependabot (.github/dependabot.yml) keeps
# the pins current.
permissions: {}

# One deploy at a time. A newer push waits rather than cancelling a deploy
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; don't leave the token in .git/config for
          # install scripts to find.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Blocks only on critical advisories in what ships to the browser;
      # lesser ones arrive as Dependabot PRs.
      - run: npm audit --omit=dev --audit-level=critical

      - run: npm run typecheck

      - name: Build for Cloudflare
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://portfolio.ancientsky14.workers.dev

      # A missing _headers would deploy a site with no security headers and
      # no error anywhere. Fail loudly instead.
      - name: Check the headers file
        run: grep -q "Content-Security-Policy" out/_headers

      - name: Prepare the GitHub Pages redirect
        run: mkdir pages-redirect && cp redirect/index.html pages-redirect/index.html && cp redirect/index.html pages-redirect/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-redirect

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-cloudflare
          path: out
          retention-days: 1

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare
      url: https://portfolio.ancientsky14.workers.dev
    steps:
      # Only wrangler.jsonc — nothing from package.json is installed in the
      # job that holds the Cloudflare token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: site
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-cloudflare
          path: site/out

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Pinned wrangler, run from a folder with no package.json.
      - name: Deploy to Cloudflare
        working-directory: site
        run: npx --yes wrangler@4.133.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
