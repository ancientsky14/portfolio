# Builds the static export and publishes it to GitHub Pages.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Nothing else — no gh-pages branch, no token.
#
# The site is served from https://ancientsky14.github.io/portfolio/, so the
# build runs with NEXT_PUBLIC_BASE_PATH=/portfolio. The path follows the repo
# name, case and all: renaming the repo means changing both values below. If
# the site moves to a custom domain, set that variable to "" and add
# public/CNAME.

name: Deploy to GitHub Pages

on:
  push:
    branches: [portfolio]
  workflow_dispatch:

# Security (R23): no permissions by default; each job asks for its own. The
# build job runs `npm ci` — every dependency's install scripts — so it gets
# read access only. Deploy rights (pages, id-token) live in the deploy job,
# which runs no third-party package code.
#
# Actions are pinned to full commit SHAs, not tags: a tag can be moved to
# different code, a SHA cannot. Dependabot (.github/dependabot.yml) keeps
# the pins current.
permissions: {}

# One deploy at a time. A newer push waits rather than cancelling a deploy
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes; don't leave the token in .git/config for
          # install scripts to find.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Blocks only on critical advisories in what ships to the browser;
      # lesser ones arrive as Dependabot PRs.
      - run: npm audit --omit=dev --audit-level=critical

      - run: npm run typecheck

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /portfolio
          NEXT_PUBLIC_SITE_URL: https://ancientsky14.github.io/portfolio

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
